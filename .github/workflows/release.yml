name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download compile-only dependencies
        run: |
          # AP and JEI are downloaded from Modrinth; Vault and Curios are in libs/ via Git LFS

          # Advanced Peripherals 0.7.31r (compile-only for mixin targets)
          AP_URL=$(curl -sL "https://api.modrinth.com/v2/project/advanced-peripherals/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.18.2%22%5D" \
            | jq -r '[.[] | select(.version_number == "0.7.31r")][0].files[0].url')
          curl -sL "$AP_URL" -o "libs/AdvancedPeripherals-1.18.2-0.7.31r.jar"

          # JEI 9.7.2.1001 (compile-only for RecipeResolver mixin)
          JEI_URL=$(curl -sL "https://api.modrinth.com/v2/project/jei/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.18.2%22%5D" \
            | jq -r '[.[] | select(.version_number | contains("9.7.2.1001"))][0].files[] | select(.filename | contains("1.18.2")) | .url' | head -1)
          curl -sL "$JEI_URL" -o "libs/jei-1.18.2-9.7.2.1001.jar"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build with Gradle
        run: gradle build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION="${{ steps.version.outputs.version }}"
          # Get everything between this version header and the next version header
          NOTES=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          # Write to file to preserve newlines
          echo "$NOTES" > release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VH CC Tweaks v${{ steps.version.outputs.version }}"
          body_path: release_notes.txt
          files: build/libs/vhcctweaks-${{ steps.version.outputs.version }}.jar
          draft: false
          prerelease: false
